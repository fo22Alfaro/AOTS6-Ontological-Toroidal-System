name: AOTS6 Global Toroidal NET
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]
permissions:
  contents: read
jobs:
  net:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q net tests
      - run: python -m unittest discover -s tests -v
      - name: Secret-pattern gate
        shell: bash
        run: '! grep -RInE --exclude-dir=.git --exclude="*.md" "(BEGIN (RSA|OPENSSH|EC|DSA|PRIVATE) KEY|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{30,})" .'
