name: AOTS6 QKD interface audit
on:
  push:
    paths:
      - "qkd/**"
      - "tests/test_qkd_interface.py"
      - "security/aots6_crypto_runtime.py"
  pull_request:
    paths:
      - "qkd/**"
      - "tests/test_qkd_interface.py"
      - "security/aots6_crypto_runtime.py"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -U pytest
      - run: pytest -q tests/test_qkd_interface.py
